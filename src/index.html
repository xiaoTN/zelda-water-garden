<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#122d29">
  <title>海拉鲁 · 水之庭</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="garden" aria-label="海拉鲁水之庭">
    <canvas id="water" aria-label="交互水池，轻点起涟漪，滑动拨水" tabindex="0"></canvas>
    <canvas id="fallback" aria-hidden="true"></canvas>
    <canvas id="life" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <svg class="emblem" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3C24 3 9 20 9 30a15 15 0 0 0 30 0C39 20 24 3 24 3Z"/><path d="M24 13v26M16 29l8 8 8-8M18 23l6 6 6-6"/></svg>
        <div><h1>海拉鲁 <span>·</span> 水之庭</h1><p>HYRULE WATER GARDEN</p></div>
      </div>
      <button id="light" class="light-button" aria-label="切换光照，当前晨光"><span class="sun-icon" aria-hidden="true">☼</span><span id="light-label">晨光</span><span class="cycle" aria-hidden="true">↻</span></button>
    </header>
    <div class="intro" aria-hidden="true"><span class="intro-line"></span><p>在旷野，留一刻给自己</p><span class="intro-line"></span></div>
    <div id="cursor" aria-hidden="true"><span></span></div>
    <div class="pool-caption" aria-hidden="true"><span>✧</span> 一池水，一点宁静 <span>✧</span></div>
    <footer class="bottom">
      <div id="rain-options" class="rain-options" role="group" aria-label="选择雨势" hidden>
        <p>雨势<span>雨越大，雷电越频繁</span></p>
        <div class="rain-levels">
          <button data-rain="0" aria-pressed="true">停雨</button>
          <button data-rain="1" aria-pressed="false">小雨</button>
          <button data-rain="2" aria-pressed="false">中雨</button>
          <button data-rain="3" aria-pressed="false">大雨</button>
          <button data-rain="4" aria-pressed="false">暴雨</button>
        </div>
      </div>
      <p id="hint" class="hint" role="status" aria-live="polite">轻点泛起涟漪 · 滑动拨开水面 · 长按蓄起水波</p>
      <nav class="toolbar" aria-label="水面玩法">
        <div class="modes" role="group" aria-label="选择交互方式">
          <button class="mode selected" data-mode="touch" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11Z"/><path d="M9 15c0 2 1 3 3 3"/></svg><span>拨水</span></button>
          <button class="mode" data-mode="leaf" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4S6 2 4 12s8 11 12 4 3-12 3-12Z"/><path d="m7 18 9-11M9 15l-1-5m4 2 4 1"/></svg><span>浮叶</span></button>
          <button class="mode" data-mode="stone" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v5m-5-4v3m10-3v3M5 13l5-4 7 2 3 7-6 4-9-3-2-3Z"/><path d="m10 9 3 7 7 2m-7-2 1 6"/></svg><span>落石</span></button>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <div class="extras">
          <button id="rain" class="utility" aria-label="开启小雨并选择雨势" aria-pressed="false" aria-expanded="false" aria-controls="rain-options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14a4 4 0 0 1-1-8 6 6 0 0 1 11-1 4 4 0 0 1 2 9"/><path d="m7 16-1 4m6-4-1 4m6-4-1 4"/></svg><span id="rain-label">下雨</span></button>
          <button id="sound" class="utility" aria-label="开启水声、雨声和雷声" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5Z"/><path class="sound-wave" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg><span>声音</span></button>
          <button id="reset" class="utility" aria-label="让水池归于平静"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg><span>平静</span></button>
        </div>
      </nav>
      <p class="footnote">风吹过的地方，水会记得。</p>
    </footer>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div id="loading"><span></span><p>走进水之庭…</p></div>
  </main>
  <script src="./water-core.js"></script>
  <script src="./scene.js"></script>
  <script src="./terrain.js"></script>
  <script src="./physics.js"></script>
  <script src="./falling-stones.js"></script>
  <script src="./fish-asset.js"></script>
  <script src="./fish.js"></script>
  <script src="./water-maps.js"></script>
  <script src="./renderer.js"></script>
  <script src="./weather.js"></script>
  <script src="./water-tap-asset.js"></script>
  <script src="./water-audio.js"></script>
  <script src="./app.js"></script>
</body>
</html>
